name: Build and Deploy Photo Gallery

on:
  push:
    branches:
      - main # Change to 'master' if your default branch is named master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Gallery Index
        run: node generate-gallery.js

      - name: Commit & Push updated index
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gallery-data.json
          git status
          git diff-index --quiet HEAD || git commit -m "Auto-update gallery index"
          git push
