<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Privacy & AI Indexing Protection -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow">
  <title>Photo Gallery</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-snap-type: y mandatory;
    }

    body {
      background-color: #0a0a0a;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    .gallery {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100vw;
      /* 30px vertical spacing between cards */
      gap: 30px;
      padding-bottom: 30px;
    }

    .photo-card {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      /* Prevents layout collapse across aspect ratio transitions */
      flex-shrink: 0;
    }

    .image-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      /* Dedicated space for image frame to preserve room for caption below */
      height: calc(100vh - 100px);
      overflow: hidden;
    }

    .image-wrapper img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
    }

    .image-wrapper img.loaded {
      opacity: 1;
    }

    /* Filename caption placed directly below photo */
    .caption {
      margin-top: 16px;
      height: 24px;
      line-height: 24px;
      font-size: 0.85rem;
      font-weight: 400;
      color: #999999;
      text-align: center;
      letter-spacing: 0.5px;
      max-width: 90vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <div class="gallery" id="gallery"></div>

  <script>
    // Case-insensitive passphrase check
    const REQUIRED_PASSPHRASE = "circe";

    if (sessionStorage.getItem("gallery_auth") !== "true") {
      const input = prompt("Enter the passphrase to view the gallery:");

      if (input && input.trim().toLowerCase() === REQUIRED_PASSPHRASE) {
        sessionStorage.setItem("gallery_auth", "true");
      } else {
        alert("Incorrect passphrase.");
        document.body.innerHTML = "<h1 style='color:#fff; text-align:center; margin-top:20vh; font-family:sans-serif;'>Access Denied</h1>";
        throw new Error("Unauthorized access attempt.");
      }
    }

    let currentIndex = 0;
    let cards = [];

    // Inactivity and Slideshow Timers
    let inactivityTimer = null;
    let slideshowInterval = null;
    const INACTIVITY_DELAY = 2 * 60 * 1000; // 2 minutes (in milliseconds)
    const SLIDESHOW_INTERVAL = 1 * 60 * 1000; // 1 minute (in milliseconds)

    async function loadGallery() {
      try {
        const response = await fetch('./gallery-data.json');
        const photos = await response.json();
        const galleryElement = document.getElementById('gallery');

        photos.forEach(photo => {
          const card = document.createElement('div');
          card.className = 'photo-card';

          const wrapper = document.createElement('div');
          wrapper.className = 'image-wrapper';

          const img = document.createElement('img');
          img.src = photo.src.split('/').map(encodeURIComponent).join('/');
          img.alt = photo.filename;
          img.loading = "lazy";

          img.onload = () => img.classList.add('loaded');

          const caption = document.createElement('div');
          caption.className = 'caption';
          caption.textContent = photo.filename;

          wrapper.appendChild(img);
          card.appendChild(wrapper);
          card.appendChild(caption);
          galleryElement.appendChild(card);
        });

        cards = document.querySelectorAll('.photo-card');
        setupKeyboardNavigation();
        setupSlideshowController();
      } catch (err) {
        console.error("Failed to load images:", err);
      }
    }

    function setupKeyboardNavigation() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            currentIndex = Array.from(cards).indexOf(entry.target);
          }
        });
      }, { threshold: 0.6 });

      cards.forEach(card => observer.observe(card));

      window.addEventListener('keydown', (e) => {
        if (['ArrowUp', 'ArrowLeft'].includes(e.key)) {
          e.preventDefault();
          if (currentIndex > 0) {
            currentIndex--;
            cards[currentIndex].scrollIntoView({ behavior: 'smooth' });
          }
        } else if (['ArrowDown', 'ArrowRight', ' '].includes(e.key)) {
          e.preventDefault();
          if (currentIndex < cards.length - 1) {
            currentIndex++;
            cards[currentIndex].scrollIntoView({ behavior: 'smooth' });
          }
        }
      });
    }

    // Advanced Slideshow Logic
    function nextPhoto() {
      if (cards.length === 0) return;
      // Loop back to the beginning if we reach the end
      currentIndex = (currentIndex + 1) % cards.length;
      cards[currentIndex].scrollIntoView({ behavior: 'smooth' });
    }

    function startSlideshow() {
      if (!slideshowInterval) {
        // Advance once immediately when starting, then every minute
        nextPhoto();
        slideshowInterval = setInterval(nextPhoto, SLIDESHOW_INTERVAL);
      }
    }

    function stopSlideshow() {
      if (slideshowInterval) {
        clearInterval(slideshowInterval);
        slideshowInterval = null;
      }
    }

    function resetInactivityTimer() {
      // User performed an action: stop active slideshow & reset delay
      stopSlideshow();
      clearTimeout(inactivityTimer);
      inactivityTimer = setTimeout(startSlideshow, INACTIVITY_DELAY);
    }

    function setupSlideshowController() {
      // Listen for user interactions to reset the 2-minute timer
      window.addEventListener('keydown', resetInactivityTimer);
      window.addEventListener('mousemove', resetInactivityTimer);
      window.addEventListener('scroll', resetInactivityTimer, { passive: true });
      window.addEventListener('touchstart', resetInactivityTimer, { passive: true });

      // Start counting down right when the page loads
      resetInactivityTimer();
    }

    loadGallery();
  </script>
</body>
</html>
