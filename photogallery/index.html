<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-snap-type: y mandatory;
    }

    body {
      background-color: #0a0a0a;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    .gallery {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100vw;
      /* 30px spacing between photo cards */
      gap: 30px;
      padding-bottom: 30px;
    }

    .photo-card {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      /* Prevents layout collapse across aspect ratios */
      flex-shrink: 0;
    }

    .image-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      /* Leaves dedicated room for 30px gap + caption text below */
      height: calc(100vh - 100px);
      overflow: hidden;
    }

    .image-wrapper img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
    }

    .image-wrapper img.loaded {
      opacity: 1;
    }

    /* Fixed caption styling placed neatly below the photo */
    .caption {
      margin-top: 16px;
      height: 24px;
      line-height: 24px;
      font-size: 0.85rem;
      font-weight: 400;
      color: #999999;
      text-align: center;
      letter-spacing: 0.5px;
      max-width: 90vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <div class="gallery" id="gallery"></div>

  <script>
    let currentIndex = 0;
    let cards = [];

    async function loadGallery() {
      try {
        const response = await fetch('./gallery-data.json');
        const photos = await response.json();
        const galleryElement = document.getElementById('gallery');

        photos.forEach(photo => {
          const card = document.createElement('div');
          card.className = 'photo-card';

          const wrapper = document.createElement('div');
          wrapper.className = 'image-wrapper';

          const img = document.createElement('img');
          img.src = photo.src.split('/').map(encodeURIComponent).join('/');
          img.alt = photo.filename;
          img.loading = "lazy";

          img.onload = () => img.classList.add('loaded');

          const caption = document.createElement('div');
          caption.className = 'caption';
          caption.textContent = photo.filename;

          wrapper.appendChild(img);
          card.appendChild(wrapper);
          card.appendChild(caption);
          galleryElement.appendChild(card);
        });

        cards = document.querySelectorAll('.photo-card');
        setupKeyboardNavigation();
      } catch (err) {
        console.error("Failed to load images:", err);
      }
    }

    function setupKeyboardNavigation() {
      // Track active photo on manual scroll
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            currentIndex = Array.from(cards).indexOf(entry.target);
          }
        });
      }, { threshold: 0.6 });

      cards.forEach(card => observer.observe(card));

      // Handle Keyboard Shortcuts
      window.addEventListener('keydown', (e) => {
        if (['ArrowUp', 'ArrowLeft'].includes(e.key)) {
          e.preventDefault();
          if (currentIndex > 0) {
            currentIndex--;
            cards[currentIndex].scrollIntoView({ behavior: 'smooth' });
          }
        } else if (['ArrowDown', 'ArrowRight', ' '].includes(e.key)) {
          e.preventDefault();
          if (currentIndex < cards.length - 1) {
            currentIndex++;
            cards[currentIndex].scrollIntoView({ behavior: 'smooth' });
          }
        }
      });
    }

    loadGallery();
  </script>
</body>
</html>
