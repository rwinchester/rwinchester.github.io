name: Build and Deploy Photo Gallery

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Gallery Index
        working-directory: ./photogallery
        run: node generate-gallery.js

      - name: Commit & Push updated index
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f photogallery/gallery-data.json
          git status
          git commit -m "Auto-update gallery index" || exit 0
          git push
